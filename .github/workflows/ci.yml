name: SecureExam CI Pipeline

on:
  push:
    branches: [ main, feat/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Test & Build Frontend (React + Vite)
  # ----------------------------------------------------
  frontend-ci:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter (if configured)
        run: npm run lint --if-present

      - name: Build Frontend Application
        run: npm run build

  # ----------------------------------------------------
  # JOB 2: Backend Validation (Node.js + Express)
  # ----------------------------------------------------
  backend-ci:
    name: Backend (Node.js + Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Backend Syntax
        run: node --check server.js

  # ----------------------------------------------------
  # JOB 3: AI Proctoring Validation (Python)
  # ----------------------------------------------------
  ai-proctoring-ci:
    name: AI Proctoring (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_proctoring

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai_proctoring/requirements.txt

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Validate Python Syntax
        run: python -m py_compile main.py

